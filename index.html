<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>BuiltField ｜ 学習ページ</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f3eee3;
      color: #2b2b2b;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
    }
    h1 {
      color: #0B3D3A;
      border-bottom: 4px solid #C79A3E;
      padding-bottom: 10px;
    }
    h2 {
      color: #0B3D3A;
      margin-top: 36px;
    }
    p { font-size: 18px; }
    ul { font-size: 18px; }
    li { margin-bottom: 8px; }
    .box {
      background-color: #ffffff;
      border: 1px solid #e2ddd0;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
    }
        .intro {
      background-color: #0B3D3A;
      color: #ffffff;
      border-left: 8px solid #C79A3E;
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 12px;
    }
    .btn {
      display: inline-block;
      background-color: #C79A3E;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>こんにちは、わたしのページ</h1>
  <h2>自己紹介</h2>
 <div class="intro">
   <p>合同会社BuiltFieldの代表です。AI・ITを学びながら、会社の事業を進めています。</p>
 </div>
    <a class="btn" href="https://builtfield.co.jp" target="_blank">会社サイトはこちら</a>
  <h2>できること（学習中）</h2>
  <ul>
    <li>HTML / CSS でWebページを作る</li>
    <li>GitHub でコードを管理・公開する</li>
    <li>AI（ChatGPT・Claude）を活用する</li>
    <li>GitHub pages でサイトを公開する</li>
  </ul>

  <h2>これから学ぶこと</h2>
  <div class="box">
    <p>JavaScript ／ WordPress ／ Webアプリ開発 ／ AIアプリ開発</p>
    <p>目標：基本情報技術者・G検定などの資格取得</p>
  </div>
<h2>やることメモ</h2>
<input type="text" id="todo" placeholder="やることを入力">
<button onclick="tsuika()">追加する</button>
<ul id="list"></ul>

<script>
  var memoList = JSON.parse(localStorage.getItem('memoList')) || [];

  function hyoji() {
    document.getElementById('list').innerHTML = '';
    for (var i = 0; i < memoList.length; i++) {
      var li = document.createElement('li');
      li.textContent = memoList[i];

      // 削除ボタンを作る
      var btn = document.createElement('button');
      btn.textContent = '✕';
      btn.style.marginLeft = '10px';
      btn.onclick = (function(index) {
        return function() {
          memoList.splice(index, 1);                                  // その項目を消す
          localStorage.setItem('memoList', JSON.stringify(memoList)); // 保存し直す
          hyoji();                                                    // 表示し直す
        };
      })(i);

      li.appendChild(btn);
      document.getElementById('list').appendChild(li);
    }
  }

  function tsuika() {
    var nyuryoku = document.getElementById('todo').value;
    if (nyuryoku === '') return;
    memoList.push(nyuryoku);
    localStorage.setItem('memoList', JSON.stringify(memoList));
    document.getElementById('todo').value = '';
    hyoji();
  }

  hyoji();
</script>
</body>
</html>
