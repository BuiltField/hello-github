<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>BuiltField ｜ 学習ページ</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f3eee3;
      color: #2b2b2b;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
    }
    h1 {
      color: #0B3D3A;
      border-bottom: 4px solid #C79A3E;
      padding-bottom: 10px;
    }
    h2 {
      color: #0B3D3A;
      margin-top: 36px;
    }
    p { font-size: 18px; }
    ul { font-size: 18px; }
    li { margin-bottom: 8px; }
    .box {
      background-color: #ffffff;
      border: 1px solid #e2ddd0;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
    }
        .intro {
      background-color: #0B3D3A;
      color: #ffffff;
      border-left: 8px solid #C79A3E;
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 12px;
    }
    .btn {
      display: inline-block;
      background-color: #C79A3E;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>こんにちは、わたしのページ</h1>
  <h2>自己紹介</h2>
 <div class="intro">
   <p>合同会社BuiltFieldの代表です。AI・ITを学びながら、会社の事業を進めています。</p>
 </div>
    <a class="btn" href="https://builtfield.co.jp" target="_blank">会社サイトはこちら</a>
  <h2>できること（学習中）</h2>
  <ul>
    <li>HTML / CSS でWebページを作る</li>
    <li>GitHub でコードを管理・公開する</li>
    <li>AI（ChatGPT・Claude）を活用する</li>
    <li>GitHub pages でサイトを公開する</li>
  </ul>

  <h2>これから学ぶこと</h2>
  <div class="box">
    <p>JavaScript ／ WordPress ／ Webアプリ開発 ／ AIアプリ開発</p>
    <p>目標：基本情報技術者・G検定などの資格取得</p>
  </div>
<input type="text" id="namae" placeholder="お名前を入力">
<button onclick="document.getElementById('aisatsu').textContent = 'こんにちは、' + document.getElementById('namae').value + 'さん！'">あいさつする</button>
<p id="aisatsu"></p>
</body>
</html>
